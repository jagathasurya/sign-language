<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Speech to Sign Language</title>
  <link rel="stylesheet" href="style1.css" />
</head>
<body>
  <main class="container">
    <h1>Speech to Sign Language Translator</h1>

    <section>
      <button onclick="startSpeechRecognition()" aria-label="Start speech recognition">
        🎤 Start Speaking
      </button>
      <p id="spokenText">Say something to translate...</p>
    </section>

    <section id="signOutput" class="sign-output" aria-live="polite"></section>
  </main>

  <script src="script2.js"></script>
</body>
</html>
