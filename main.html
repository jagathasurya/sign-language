<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text and Speech to Sign Language</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      max-width: 600px;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    h2 {
      font-size: 28px;
      color: #2575fc;
      margin-bottom: 20px;
    }

    .input-container {
      position: relative;
      margin-bottom: 20px;
    }

    input[type="text"] {
      padding: 15px 40px 15px 20px;
      width: 80%; /* Reduced width to 80% */
      font-size: 18px;
      border-radius: 8px;
      border: 2px solid #ddd;
      outline: none;
      transition: all 0.3s;
      margin-right: 0;
    }

    input[type="text"]:focus {
      border-color: #2575fc;
    }

    .speech-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 26px;
      color: #2575fc;
      transition: color 0.3s;
    }

    .speech-icon:hover {
      color: #6a11cb;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      background-color: #2575fc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #6a11cb;
    }

    #spokenText {
      font-size: 18px;
      color: #333;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    #statusMsg {
      color: red;
      font-weight: bold;
    }

    #signOutput {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 30px;
    }

    #signOutput img,
    #signOutput video {
      margin: 15px;
      border-radius: 10px;
      max-width: 350px;
      max-height: 250px;
    }

  </style>
</head>
<body>
  <div class="container">
    <h2>Sign Language Translater</h2>

    <!-- Text and Speech Input Area -->
    <div class="input-container">
      <input type="text" id="textInput" placeholder="Type text or click the mic icon to speak" />
      <span class="speech-icon" onclick="startSpeechRecognition()">🎤</span>
    </div>

    <!-- Convert Button -->
    <button onclick="convertTextToSign()">Convert</button>

    <!-- Spoken Text Display -->
    <p id="spokenText"></p>
    <p id="statusMsg"></p>

    <!-- Sign Language Output -->
    <div id="signOutput"></div>
  </div>

  <script src="script3.js"></script>

</body>
</html>
